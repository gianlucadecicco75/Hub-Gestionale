<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskFlow — Hub Amministratore</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%236d28d9'/%3E%3Ctext x='12' y='17' font-size='13' text-anchor='middle'%3E%F0%9F%94%80%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%236d28d9'/%3E%3Ctext x='12' y='17' font-size='13' text-anchor='middle'%3E%F0%9F%94%80%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="hub-manifest.json">
<style>
  :root { --accent:#1a73e8; --bg:#f5f5f7; --border:#e2e2e6; --text1:#1a1a1a; --text3:#8a8a90; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:var(--bg); margin:0; padding:28px 16px 60px; color:var(--text1); }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; }
  .sub { color: var(--text3); font-size: 13px; margin-bottom: 18px; }
  .testa { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  button { border:none; border-radius:7px; padding:9px 14px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .btn-vai { background: var(--accent); color:#fff; }
  .btn-sec { background:#fff; color:#333; border:1px solid var(--border); }
  .btn-ghost { background:transparent; color:var(--text3); font-weight:500; padding:9px 8px; }
  .btn-elimina { background:transparent; color:var(--red); padding:9px 8px; }
  .totali { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .tot { flex:1; min-width:150px; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .tot b { display:block; font-size:24px; }
  .tot span { font-size:12px; color:var(--text3); }
  .griglia { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; border-top:4px solid var(--accent); }
  .card h2 { font-size:16px; margin:0 0 2px; }
  .url { font-size:11px; color:var(--text3); word-break:break-all; margin-bottom:12px; }
  .kpi { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
  .kpi div { background:#f7f7f9; border-radius:8px; padding:8px 6px; text-align:center; }
  .kpi b { display:block; font-size:19px; }
  .kpi span { font-size:10.5px; color:var(--text3); }
  .kpi .evid { background:#fef3c7; } .kpi .evid b { color:var(--amber); }
  .riga { font-size:12.5px; color:#444; display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  .riga b { color:var(--text1); }
  .ultime { margin-top:8px; border-top:1px solid var(--border); padding-top:8px; font-size:12px; }
  .ultime .u { padding:3px 0; color:#444; }
  .ultime .tag { background:#dcfce7; color:#166534; border-radius:4px; font-size:10px; padding:1px 5px; margin-left:4px; font-weight:700; }
  .az { display:flex; gap:6px; margin-top:12px; align-items:center; }
  .err { color:var(--red); font-size:12.5px; background:#fee2e2; border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .muto { color:var(--text3); font-size:12.5px; }
  .form { background:#fff; border:1px solid var(--border); border-radius:10px; padding:18px; margin-top:16px; display:none; max-width:560px; }
  .form.aperto { display:block; }
  label { display:block; font-size:12px; font-weight:600; margin:10px 0 4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; }
  .nota { font-size:11.5px; color:var(--text3); margin-top:4px; }
  .errore { color:var(--red); font-size:12.5px; margin-top:10px; min-height:16px; }
  .avviso-nuove { background:#dcfce7; border:1px solid #86efac; border-radius:10px; padding:10px 14px; margin-bottom:14px; display:none; font-size:13.5px; }
  .avviso-nuove.on { display:block; }
  .avviso-nuove .riga2 { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .blocco { margin-top:10px; border-top:1px solid var(--border); padding-top:8px; }
  .blocco .tit { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; display:flex; justify-content:space-between; align-items:center; }
  .meteo { display:flex; gap:6px; }
  .meteo div { flex:1; text-align:center; background:#f0f9ff; border-radius:8px; padding:5px 2px; font-size:11px; color:#444; }
  .meteo b { display:block; font-size:13px; color:#111; }
  .meteo .ic { font-size:20px; line-height:1.2; }
  .link { background:none; border:none; color:var(--accent); font-size:11.5px; font-weight:600; padding:0; cursor:pointer; }
  .empty { color:var(--text3); font-size:13px; padding:24px 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="testa">
    <div>
      <h1>🔀 Hub Amministratore</h1>
      <div class="sub">Tutte le tue strutture in un colpo d'occhio. <span id="ultimo-agg"></span></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-sec" id="btn-notif" onclick="attivaNotifiche()" style="display:none">🔔 Attiva notifiche</button>
      <button class="btn-sec" id="btn-agg" onclick="aggiornaTutto()" style="display:none">↻ Aggiorna</button>
      <button class="btn-ghost" id="btn-esci" onclick="esci()" style="display:none">Esci</button>
    </div>
  </div>

  <div id="vista-login" style="display:none">
    <div class="form aperto" style="margin-top:0">
      <label>Email</label>
      <input type="email" id="l-email" autocomplete="username" placeholder="la tua email di amministratore">
      <label>Password</label>
      <input type="password" id="l-password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entra()">
      <div style="margin-top:14px"><button class="btn-vai" onclick="entra()">Entra</button></div>
      <div class="errore" id="l-errore"></div>
    </div>
  </div>

  <div id="vista-hub" style="display:none">
    <div class="avviso-nuove" id="avviso-nuove"></div>
    <div class="totali" id="totali"></div>
    <div class="muto" id="stato" style="margin-bottom:10px"></div>
    <div class="griglia" id="lista"></div>
    <div style="margin-top:14px"><button class="btn-vai" onclick="mostraForm()">+ Aggiungi struttura</button></div>
    <div class="form" id="form">
      <input type="hidden" id="f-id">
      <label>Nome struttura</label>
      <input type="text" id="f-nome" placeholder="es. Greta's House">
      <label>Indirizzo del PMS (il sito da aprire)</label>
      <input type="text" id="f-url" placeholder="https://...">
      <label>Email di accesso al PMS</label>
      <input type="email" id="f-email" placeholder="tuaemail@...">
      <label>Password di accesso al PMS</label>
      <input type="password" id="f-password" placeholder="••••••••">
      <label>Supabase URL della struttura (facoltativo: già noto per Greta's e Villa Aurora)</label>
      <input type="text" id="f-sburl" placeholder="https://xxxx.supabase.co">
      <label>Chiave pubblica "anon" di quel progetto</label>
      <input type="text" id="f-sbkey" placeholder="eyJ...">
      <div class="nota">Si trovano in Supabase → progetto della struttura → Project Settings → API (URL e "anon public"). Con email e password il Hub legge i dati di quella struttura, in sola lettura.</div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn-vai" onclick="salva()">Salva</button>
        <button class="btn-ghost" onclick="nascondiForm()">Annulla</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Progetto Supabase "Amministratore". La chiave è quella pubblica: da sola non permette di leggere nulla.
var SB_URL = 'https://xhacoxddmcjwvwwygdsa.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoYWNveGRkbWNqd3Z3d3lnZHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjM3ODUsImV4cCI6MjEwMjAzOTc4NX0.G7dbZAyG9hinOU-h3WmsZGeCNd8AfwXY4eN7doSL5qk';
var sb = supabase.createClient(SB_URL, SB_KEY);

// Progetti Supabase delle strutture (URL + chiave pubblica "anon", pensate per essere pubbliche).
// Si abbinano alla struttura se il suo nome o indirizzo contiene il testo "cerca". Per aggiungerne
// uno nuovo basta una riga qui sotto, oppure compilare i campi con ✎ Modifica.
var PROGETTI_FISSI = [
  { cerca:'greta', url:'https://xhacoxddmcjwvwwygdsa.supabase.co',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoYWNveGRkbWNqd3Z3d3lnZHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjM3ODUsImV4cCI6MjEwMjAzOTc4NX0.G7dbZAyG9hinOU-h3WmsZGeCNd8AfwXY4eN7doSL5qk' },
  { cerca:'villaaurora', url:'https://surkplkjhrnheulzfaxv.supabase.co',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmtwbGtqaHJuaGV1bHpmYXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjQwNTcsImV4cCI6MjA5OTQwMDA1N30.4wmz67Xj38f6DfeVCZx6zBrQjOPIWqs2yUGHpVwXucs' },
  { cerca:'villa aurora', url:'https://surkplkjhrnheulzfaxv.supabase.co',
    key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cmtwbGtqaHJuaGV1bHpmYXh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MjQwNTcsImV4cCI6MjA5OTQwMDA1N30.4wmz67Xj38f6DfeVCZx6zBrQjOPIWqs2yUGHpVwXucs' }
];
function progettoDi(s){
  var url = (s.sb_url||'').trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), key = (s.sb_key||'').trim();
  if (url && key) return { url:url, key:key };
  var testo = ((s.nome||'')+' '+(s.url||'')).toLowerCase();
  for (var i=0;i<PROGETTI_FISSI.length;i++) if (testo.indexOf(PROGETTI_FISSI[i].cerca)>=0) return PROGETTI_FISSI[i];
  return null;
}
var listaCache = [];
var datiStrutt = {};   // id -> {ok, errore, ...}

function el(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addG(ds,n){ var p=ds.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return ymd(d); }
function euro(n){ return (Number(n)||0).toLocaleString('it-IT',{maximumFractionDigits:0})+' €'; }
function fmtD(ds){ var p=(ds||'').split('-'); return p.length===3 ? p[2]+'/'+p[1] : ds; }

function mostraForm(s){
  el('form').classList.add('aperto');
  el('f-id').value = s ? s.id : '';
  el('f-nome').value = s ? s.nome||'' : '';
  el('f-url').value = s ? s.url||'' : '';
  el('f-email').value = s ? s.email||'' : '';
  el('f-password').value = s ? s.password||'' : '';
  el('f-sburl').value = s ? s.sb_url||'' : '';
  el('f-sbkey').value = s ? s.sb_key||'' : '';
  el('f-nome').focus();
  el('form').scrollIntoView({behavior:'smooth'});
}
function nascondiForm(){ el('form').classList.remove('aperto'); }
function modifica(id){ mostraForm(listaCache.find(function(x){return x.id===id;})); }
function vistaLogin(){ el('vista-login').style.display='block'; el('vista-hub').style.display='none'; el('btn-esci').style.display='none'; el('btn-agg').style.display='none'; el('btn-notif').style.display='none'; }
function vistaHub(){ el('vista-login').style.display='none'; el('vista-hub').style.display='block'; el('btn-esci').style.display='inline-block'; el('btn-agg').style.display='inline-block'; mostraBtnNotif(); caricaLista(); }

async function entra(){
  var email = el('l-email').value.trim(), pw = el('l-password').value;
  el('l-errore').textContent = '';
  if (!email || !pw) { el('l-errore').textContent = 'Inserisci email e password.'; return; }
  var r = await sb.auth.signInWithPassword({ email: email, password: pw });
  if (r.error) { el('l-errore').textContent = 'Accesso non riuscito: controlla email e password.'; return; }
  el('l-password').value = '';
  vistaHub();
}
async function esci(){
  await sb.auth.signOut();
  listaCache = []; datiStrutt = {}; el('lista').innerHTML = ''; el('totali').innerHTML = '';
  vistaLogin();
}

async function caricaLista(){
  el('stato').textContent = 'Caricamento…';
  try {
    var r = await sb.from('hub_strutture').select('*').order('creato_il', { ascending: true });
    if (r.error) throw r.error;
    listaCache = r.data || [];
    el('stato').textContent = '';
    render();
    aggiornaTutto();
  } catch (err) {
    console.error(err);
    el('stato').textContent = '⚠ Non riesco a leggere l\'elenco. Controlla la connessione, oppure esci e rientra.';
  }
}

async function salva(){
  var id = el('f-id').value;
  var rec = { nome: el('f-nome').value.trim(), url: el('f-url').value.trim(), email: el('f-email').value.trim(),
              password: el('f-password').value, sb_url: el('f-sburl').value.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''), sb_key: el('f-sbkey').value.trim() };
  if (!rec.nome || !rec.url) { alert('Inserisci almeno nome e indirizzo del sito'); return; }
  try {
    var r = id ? await sb.from('hub_strutture').update(rec).eq('id', id) : await sb.from('hub_strutture').insert(rec);
    if (r.error) throw r.error;
    nascondiForm();
    await caricaLista();
  } catch (err) {
    console.error(err);
    alert('Salvataggio non riuscito. Se hai appena aggiornato il Hub, hai eseguito lo script SQL "hub-panoramica.sql"?');
  }
}
async function elimina(id){
  if (!confirm('Rimuovere questa struttura dall\'elenco?')) return;
  var r = await sb.from('hub_strutture').delete().eq('id', id);
  if (r.error) { alert('Eliminazione non riuscita.'); return; }
  await caricaLista();
}
function vai(id, pagina){
  var s = listaCache.find(function(x){ return x.id === id; });
  if (!s) return;
  var url = s.url;
  if (s.email && s.password) {
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'autologin_email=' + encodeURIComponent(s.email) + '&autologin_password=' + encodeURIComponent(s.password);
  }
  if (pagina) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'apri_pagina=' + encodeURIComponent(pagina);
  window.location.href = url;
}

// ── Meteo (Open-Meteo, gratuito) ──
var METEO_EMOJI = function(c){
  if (c===0) return '☀️'; if (c===1) return '🌤'; if (c===2) return '⛅'; if (c===3) return '☁️';
  if (c===45||c===48) return '🌫'; if (c>=51&&c<=67) return '🌧'; if (c>=71&&c<=77) return '🌨';
  if (c>=80&&c<=82) return '🌦'; if (c>=85&&c<=86) return '🌨'; if (c>=95) return '⛈'; return '☁️';
};
async function leggiMeteo(lat, lon){
  try {
    var r = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&daily=weathercode,temperature_2m_max&timezone=Europe%2FRome&forecast_days=4');
    var d = await r.json();
    if (!d.daily) return null;
    return d.daily.time.map(function(t,i){ return { data:t, code:d.daily.weathercode[i], temp:d.daily.temperature_2m_max[i] }; });
  } catch(e){ return null; }
}
function nomeGiorno(ds,i){ if(i===0) return 'Oggi'; if(i===1) return 'Domani'; var p=ds.split('-'); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('it-IT',{weekday:'short'}); }

// ── Avviso nuove prenotazioni / preventivi ──
var _nuoveTrovate = {};   // id struttura -> {pren:[...], prev:[...]}
function visteKey(id){ return 'hub_viste_' + id; }
function leggiViste(id){ try { return JSON.parse(localStorage.getItem(visteKey(id))||'null'); } catch(e){ return null; } }
function salvaViste(id, v){ try { localStorage.setItem(visteKey(id), JSON.stringify(v)); } catch(e){} }
function controllaNuove(s, d){
  if (!d || !d.ok) return;
  var ids = { pren: d.idPren, prev: d.idPrev };
  var viste = leggiViste(s.id);
  if (!viste) { salvaViste(s.id, ids); _nuoveTrovate[s.id] = {pren:[],prev:[]}; return; } // prima volta: nessun avviso
  _nuoveTrovate[s.id] = {
    pren: d.listaPren.filter(function(b){ return viste.pren.indexOf(b.id) < 0; }),
    prev: d.idPrev.filter(function(x){ return viste.prev.indexOf(x) < 0; })
  };
}
function segnaVisti(){
  listaCache.forEach(function(s){ var d = datiStrutt[s.id]; if (d && d.ok) salvaViste(s.id, { pren:d.idPren, prev:d.idPrev }); });
  _nuoveTrovate = {}; mostraAvviso(false);
}
var _ultimoTotAvvisato = 0;
function mostraAvviso(notifica){
  var box = el('avviso-nuove'), righe = [], tot = 0;
  listaCache.forEach(function(s){
    var n = _nuoveTrovate[s.id]; if (!n) return;
    var parti = [];
    if (n.pren.length) { parti.push(n.pren.length + (n.pren.length===1?' nuova prenotazione':' nuove prenotazioni') + ' (' + n.pren.slice(0,3).map(function(b){ return esc(b.guest_name||'—') + (b.source?' · '+esc(b.source):''); }).join(', ') + ')'); tot += n.pren.length; }
    if (n.prev.length) { parti.push(n.prev.length + (n.prev.length===1?' nuova richiesta di preventivo':' nuove richieste di preventivo')); tot += n.prev.length; }
    if (parti.length) righe.push('<div><b>'+esc(s.nome)+'</b>: '+parti.join(' · ')+' <button class="link" onclick="vai(\''+s.id+'\',\'prenotazioni\')">Apri →</button></div>');
  });
  document.title = (tot ? '('+tot+') ' : '') + 'DeskFlow — Hub Amministratore';
  if (!tot) { box.className = 'avviso-nuove'; box.innerHTML = ''; _ultimoTotAvvisato = 0; return; }
  box.className = 'avviso-nuove on';
  box.innerHTML = '<div class="riga2"><div>🔔 '+righe.join('')+'</div><button class="btn-sec" onclick="segnaVisti()">✓ Visto</button></div>';
  if (notifica && tot > _ultimoTotAvvisato) {
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Hub Amministratore', { body: tot + ' novità da vedere' }); } catch(e){}
    try { var a = new (window.AudioContext||window.webkitAudioContext)(); var o=a.createOscillator(); o.connect(a.destination); o.frequency.value=880; o.start(); setTimeout(function(){ o.stop(); a.close(); }, 180); } catch(e){}
  }
  _ultimoTotAvvisato = tot;
}
function mostraBtnNotif(){ el('btn-notif').style.display = ('Notification' in window && Notification.permission === 'default') ? 'inline-block' : 'none'; }
function attivaNotifiche(){ try { Notification.requestPermission().then(mostraBtnNotif); } catch(e){} }

// ── Lettura dei dati di una struttura (sola lettura) ──
async function leggiStruttura(s){
  var out = { ok:false };
  var prog = progettoDi(s);
  if (!prog) { out.errore = 'Panoramica non attiva: aggiungi Supabase URL e chiave (✎ Modifica).'; out.nonConfigurata = true; return out; }
  if (!s.email || !s.password) { out.errore = 'Mancano email e password di accesso (✎ Modifica).'; return out; }
  try {
    var c = supabase.createClient(prog.url, prog.key, { auth:{ persistSession:false, autoRefreshToken:false, detectSessionInUrl:false } });
    var a = await c.auth.signInWithPassword({ email:s.email, password:s.password });
    if (a.error) { out.errore = 'Accesso non riuscito (' + a.error.message + '). Se il progetto è in pausa, riattivalo da Supabase.'; return out; }
    var oggi = ymd(new Date());
    var inizioMese = oggi.slice(0,8) + '01';
    var rb = await c.from('bookings').select('id,guest_name,room_name,checkin,checkout,status,source,total_price,created_at,escludi_conteggi').gte('checkout', inizioMese).limit(5000);
    if (rb.error) throw rb.error;
    var rr = await c.from('rooms').select('id');
    var rq = await c.from('richieste_preventivo').select('id,data').limit(1000);
    // Statistiche sito (ultimi 7 giorni) e posizione per il meteo: parti facoltative, un errore non blocca il resto
    var visOggi = null, visSess = null, vis7 = null, lat = 40.1476, lon = 18.4903;
    try {
      var rv = await c.from('site_visits').select('ts,session_id').gte('ts', addG(oggi,-6)+'T00:00:00Z').limit(20000);
      if (!rv.error) {
        var vv = rv.data || [], ss = {};
        visOggi = vv.filter(function(v){ return (v.ts||'').slice(0,10) === oggi; }).length;
        vv.forEach(function(v){ if ((v.ts||'').slice(0,10) === oggi && v.session_id) ss[v.session_id] = 1; });
        visSess = Object.keys(ss).length; vis7 = vv.length;
      }
    } catch(e){}
    try {
      var rs = await c.from('app_blobs').select('data').eq('key','settings').maybeSingle();
      var st = rs && rs.data && rs.data.data; if (typeof st === 'string') st = JSON.parse(st);
      if (st && typeof st.lat === 'number' && typeof st.lon === 'number') { lat = st.lat; lon = st.lon; }
    } catch(e){}
    await c.auth.signOut();
    var meteo = await leggiMeteo(lat, lon);
    var B = (rb.data||[]).filter(function(b){ return b.status!=='cancellata' && !b.escludi_conteggi; });
    var camere = (rr.data||[]).length;
    var occ = B.filter(function(b){ return b.checkin<=oggi && b.checkout>oggi; }).length;
    var arrivi = B.filter(function(b){ return b.checkin===oggi; });
    var partenze = B.filter(function(b){ return b.checkout===oggi; });
    var fra7 = addG(oggi,7);
    var prossimi = B.filter(function(b){ return b.checkin>oggi && b.checkin<=fra7; }).length;
    var ieri2 = new Date(Date.now()-48*3600*1000).toISOString();
    var nuove = B.filter(function(b){ return (b.created_at||'') >= ieri2; });
    var ultime = B.slice().sort(function(x,y){ return (y.created_at||'').localeCompare(x.created_at||''); }).slice(0,3);
    var mese = B.filter(function(b){ return b.checkin>=inizioMese && b.checkin<=oggi.slice(0,8)+'31'; }).reduce(function(t,b){ return t+(Number(b.total_price)||0); },0);
    var prev = (rq.data||[]).filter(function(x){ return x.data && x.data.status==='nuova'; }).length;
    var da14 = new Date(Date.now()-14*86400000).toISOString();
    var listaPren = B.filter(function(b){ return (b.created_at||'') >= da14; });
    var idPrev = (rq.data||[]).filter(function(x){ return x.data && x.data.status==='nuova'; }).map(function(x){ return x.id; });
    out = { visOggi:visOggi, visSess:visSess, vis7:vis7, meteo:meteo, listaPren:listaPren, idPren:listaPren.map(function(b){return b.id;}), idPrev:idPrev, ok:true, camere:camere, occ:occ, arrivi:arrivi.length, partenze:partenze.length, prossimi:prossimi,
            nuove:nuove.length, ultime:ultime, mese:mese, prev: rq.error ? null : prev };
  } catch (e) { console.error(e); out.errore = 'Non riesco a leggere i dati (' + (e.message||e) + ').'; }
  return out;
}

async function aggiornaTutto(){
  el('ultimo-agg').textContent = '— aggiornamento…';
  await Promise.all(listaCache.map(async function(s){
    datiStrutt[s.id] = await leggiStruttura(s);
    controllaNuove(s, datiStrutt[s.id]);
    render();
  }));
  render();
  mostraAvviso(true);
  el('ultimo-agg').textContent = '— aggiornato alle ' + new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
}

function render(){
  var box = el('lista');
  if (!listaCache.length) { box.innerHTML = '<div class="empty">Nessuna struttura ancora aggiunta.</div>'; el('totali').innerHTML=''; return; }
  var T = { nuove:0, arrivi:0, partenze:0, prev:0, mese:0 };
  box.innerHTML = listaCache.map(function(s){
    var d = datiStrutt[s.id];
    var corpo;
    if (!d) corpo = '<div class="muto">Caricamento dati…</div>';
    else if (!d.ok) corpo = '<div class="err">'+esc(d.errore)+'</div>';
    else {
      T.nuove+=d.nuove; T.arrivi+=d.arrivi; T.partenze+=d.partenze; T.mese+=d.mese; if (d.prev) T.prev+=d.prev;
      var perc = d.camere ? Math.round(d.occ/d.camere*100) : 0;
      corpo =
        '<div class="kpi">'+
          '<div><b>'+d.occ+'/'+d.camere+'</b><span>occupate ('+perc+'%)</span></div>'+
          '<div><b>'+d.arrivi+'</b><span>arrivi oggi</span></div>'+
          '<div><b>'+d.partenze+'</b><span>partenze oggi</span></div>'+
          '<div class="'+(d.nuove?'evid':'')+'"><b>'+d.nuove+'</b><span>nuove (48 ore)</span></div>'+
          '<div class="'+(d.prev?'evid':'')+'"><b>'+(d.prev==null?'–':d.prev)+'</b><span>preventivi da evadere</span></div>'+
          '<div><b>'+d.prossimi+'</b><span>arrivi prossimi 7 gg</span></div>'+
        '</div>'+
        '<div class="riga"><span>Incassi previsti del mese</span><b>'+euro(d.mese)+'</b></div>'+
        (d.ultime.length ? '<div class="ultime"><div class="muto" style="margin-bottom:2px">Ultime prenotazioni arrivate</div>'+
          d.ultime.map(function(b){
            var web = (b.source||'').toLowerCase().indexOf('sito')>=0;
            return '<div class="u"><b>'+esc(b.guest_name||'—')+'</b>'+(web?'<span class="tag">SITO</span>':'')+' · '+esc(b.room_name||'')+' · '+fmtD(b.checkin)+'→'+fmtD(b.checkout)+' · '+euro(b.total_price)+'</div>';
          }).join('')+'</div>' : '');
    }
    var extra = '';
    if (d && d.ok) {
      extra += '<div class="blocco"><div class="tit"><span>📈 Statistiche sito</span><button class="link" onclick="vai(\''+s.id+'\',\'statistichesito\')">Apri statistiche →</button></div>' +
        (d.visOggi==null ? '<div class="muto">Non disponibili (tabella site_visits)</div>'
          : '<div class="riga"><span>Visite oggi / visitatori</span><b>'+d.visOggi+' / '+d.visSess+'</b></div><div class="riga"><span>Ultimi 7 giorni</span><b>'+d.vis7+' visite</b></div>') + '</div>';
      extra += '<div class="blocco"><div class="tit"><span>🌤 Meteo</span></div>' +
        (d.meteo ? '<div class="meteo">'+d.meteo.map(function(m,i){ return '<div>'+nomeGiorno(m.data,i)+'<span class="ic">'+METEO_EMOJI(m.code)+'</span><b>'+Math.round(m.temp)+'°</b></div>'; }).join('')+'</div>' : '<div class="muto">Previsioni non disponibili</div>') + '</div>';
    }
    return '<div class="card"><h2>'+esc(s.nome)+'</h2><div class="url">'+esc(s.url)+'</div>'+corpo+extra+
      '<div class="az"><button class="btn-vai" onclick="vai(\''+s.id+'\')">Apri PMS →</button>'+
      '<button class="btn-ghost" onclick="modifica(\''+s.id+'\')">✎ Modifica</button>'+
      '<button class="btn-elimina" onclick="elimina(\''+s.id+'\')" title="Rimuovi">✕</button></div></div>';
  }).join('');
  el('totali').innerHTML =
    '<div class="tot"><b>'+T.nuove+'</b><span>nuove prenotazioni (48 ore)</span></div>'+
    '<div class="tot"><b>'+T.arrivi+'</b><span>arrivi oggi</span></div>'+
    '<div class="tot"><b>'+T.partenze+'</b><span>partenze oggi</span></div>'+
    '<div class="tot"><b>'+T.prev+'</b><span>preventivi da evadere</span></div>'+
    '<div class="tot"><b>'+euro(T.mese)+'</b><span>incassi previsti del mese</span></div>';
}

setInterval(function(){ if (el('vista-hub').style.display==='block' && listaCache.length) aggiornaTutto(); }, 5*60*1000);

(async function avvio(){
  try {
    var r = await sb.auth.getSession();
    if (r.data && r.data.session) vistaHub(); else vistaLogin();
  } catch (e) { vistaLogin(); }
})();
</script>
